services:
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantlab}
      POSTGRES_USER: ${POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantlab}
    ports:
      - "${QUANTLAB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quantlab-redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --appendonly yes
    ports:
      - "${QUANTLAB_REDIS_PORT:-6380}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quantlab-backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quantlab}:${POSTGRES_PASSWORD:-quantlab}@postgres:5432/${POSTGRES_DB:-quantlab}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      DATA_ROOT: /app/data
      ARTIFACT_ROOT: /app/data/backtests
      CATALOG_PATH: /app/catalog
      STRATEGY_REPO_PATH: /app
      DSH_BRIDGE_URL: http://127.0.0.1:8000/api
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-quantlab-secure-jwt-secret-key-2026-production}
    ports:
      - "${QUANTLAB_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/catalog:/app/catalog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantlab-frontend
    restart: unless-stopped
    ports:
      - "${QUANTLAB_FRONTEND_PORT:-5173}:80"
    environment:
      PORT: 80
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    env_file: .env
