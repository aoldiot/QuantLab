services:
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantlab}
      POSTGRES_USER: ${POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantlab}
    ports:
      - "${QUANTLAB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quantlab-redis
    restart: unless-stopped
    env_file: .env
    command: redis-server --appendonly yes
    ports:
      - "${QUANTLAB_REDIS_PORT:-6380}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10