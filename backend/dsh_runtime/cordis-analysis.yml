# Result Review / Analysis DSH runtime. Strictly read-only analysis of backtest results,
# performance attribution, trade logs, and robustness stress testing.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 32768

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: coding-tools
  name: './src/coding-tools.mjs'
  config:
    readablePaths:
      - 'backend/data/backtests'
      - 'data/backtests'
      - 'backend/app/quant'
      - 'app/quant'
      - 'docs'
    writablePaths: []
    ignoredDirs:
      - 'node_modules'
      - '.venv'
      - 'venv'
      - '__pycache__'
      - '.ruff_cache'
      - '.pytest_cache'
      - '.git'
      - '.idea'
      - '.vscode'
      - '.sessions'
      - 'frontend'

- id: quantlab-tools
  name: './src/quantlab-tools.mjs'
