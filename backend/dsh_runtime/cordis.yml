# QuantLab DSH runtime cordis config. The SDK injects this path via
# DSH_CORDIS_CONFIG. $DSH_CWD / $DSH_SESSION_ROOT come from the engine.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# QuantLab domain tools exposed over the HTTP bridge. The plugin must be a
# plain ESM .mjs module: the bundled loader does not transpile TypeScript.
# Cordis resolves relative plugin names from this config file's directory, so
# the runtime remains portable without evaluating an object-valued `!!js`
# expression in the loader's `name` field.
- id: quantlab-tools
  name: './src/quantlab-tools.mjs'
