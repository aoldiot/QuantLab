[project]
name = "quantlab-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy>=2.0.41",
  "asyncpg>=0.30",
  "greenlet>=3.2",
  "pydantic-settings>=2.10",
  "redis>=6.2",
  "orjson>=3.10",
  "nautilus_trader==1.230.0",
  "pandas>=2.2",
  "pyarrow>=19",
  "cryptography>=50.0.0",
  "alembic>=1.19.1",
  "httpx>=0.28",
  "pyjwt>=2.8.0",
  "deepseek-harness-sdk>=0.1.0rc6",
  "scipy>=1.13",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "catalog"]
